<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070910">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arnexu">
  <title>Recuperar contraseña | Arnexu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=2.0.0"></script>
  <script src="js/app.js?v=2.0.0"></script>
<script src="js/push-config.js?v=2.0.0"></script>
<script src="js/pwa.js?v=2.0.0"></script>
</head>
<body data-requiere="config">
  <div class="auth-layout una-columna">
    <div class="auth-mini">
      <img class="auth-logo" src="icons/icon-192.png" alt="Logo Arnexu">
      <div class="auth-marca">ARNEXU</div>
    </div>

    <div class="auth-card">
      <h2 style="margin-bottom: 10px; font-size: 24px;">Recupera tu contraseña</h2>
      <p style="color: var(--gris-neon); font-size: 14px; margin-bottom: 25px;">
        Escribe el correo con el que te registraste y te enviaremos un enlace para crear una contraseña nueva.
      </p>

      <form id="recuperarForm">
        <div class="form-group">
          <label class="form-label" for="correo">Correo electrónico</label>
          <input type="email" id="correo" class="form-input" placeholder="correo@ejemplo.com" autocomplete="email" required>
        </div>

        <button type="submit" id="btnEnviar" class="btn btn-primary btn-full">ENVIAR ENLACE</button>
      </form>

      <div id="resultado" role="status" aria-live="polite" style="display: none; margin-top: 20px; padding: 14px; border-radius: 8px; border: 1px solid var(--acento); font-size: 14px; line-height: 1.5;"></div>

      <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--gris-medio);">
        <a href="index.html" style="color: var(--acento); text-decoration: none; font-weight: 600; font-size: 14px;">← Volver a iniciar sesión</a>
      </div>
    </div>
  </div>

  <script>
    const ESPERA_SEGUNDOS = 60;
    let temporizador = null;

    function iniciarEspera() {
      const btn = document.getElementById('btnEnviar');
      let restante = ESPERA_SEGUNDOS;
      btn.disabled = true;
      btn.textContent = `REENVIAR EN ${restante}s`;
      temporizador = setInterval(() => {
        restante -= 1;
        if (restante <= 0) {
          clearInterval(temporizador);
          btn.disabled = false;
          btn.textContent = 'ENVIAR ENLACE OTRA VEZ';
        } else {
          btn.textContent = `REENVIAR EN ${restante}s`;
        }
      }, 1000);
    }

    document.getElementById('recuperarForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const correo = document.getElementById('correo').value.trim();
      const resultado = document.getElementById('resultado');
      const btn = document.getElementById('btnEnviar');
      if (!correo) return;

      btn.disabled = true;
      btn.textContent = 'ENVIANDO...';

      // El enlace del correo lleva a restablecer.html (misma carpeta que esta página)
      const redirectTo = new URL('restablecer.html', window.location.href).href;
      const { error } = await window.supabaseClient.auth.resetPasswordForEmail(correo, { redirectTo });

      if (error && error.status === 429) {
        mostrarNotificacion('Hiciste muchos intentos. Espera unos minutos y vuelve a probar.', 'error');
        btn.disabled = false;
        btn.textContent = 'ENVIAR ENLACE';
        return;
      }
      if (error) console.error('Error en recuperación:', error);

      // Mismo mensaje exista o no la cuenta, para no revelar qué correos están registrados
      resultado.style.display = 'block';
      resultado.textContent = 'Si ese correo tiene una cuenta en Arnexu, te enviamos un enlace para cambiar la contraseña. Revisa también la carpeta de spam. El enlace vence en poco tiempo.';
      iniciarEspera();
    });
  </script>
</body>
</html>
