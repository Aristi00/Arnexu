<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070910">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>Bitácora | Arnexu</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=2.0.0"></script>
<script src="js/app.js?v=2.0.0"></script>
<script src="js/push-config.js?v=2.0.0"></script>
<script src="js/pwa.js?v=2.0.0"></script>
  <script src="js/moderacion.js?v=2.0.0"></script>
  <script src="js/proyectos.js?v=2.0.0"></script>
<script src="js/badge-notifications.js?v=2.0.0"></script>
</head>
<body data-requiere="config,moderacion,proyectos">
  <nav class="navbar">
    <div class="navbar-content">
            <a href="inicio.html"><img src="arnexu-64x (1).png" alt="Logo Arnexu"></a>
      <ul class="navbar-menu">
        <li><a href="inicio.html">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          
        </a></li>
        <li><a href="crear.html">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          
        </a></li>
        <li><a href="chat.html">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          
        </a></li>
        <li><a href="perfil.html">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          
        </a></li>
        <li><a href="#" onclick="logout()" style="color: var(--error);">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          
        </a></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="max-width: 760px; margin-top: 30px; margin-bottom: 60px;">
    <div id="cabecera"><div class="loading">Cargando bitácora...</div></div>
    <div id="editor"></div>
    <div id="entradas" aria-live="polite"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const bitacoraId = params.get('id');
    let usuarioActual = null, bitacora = null, esDueno = false;

    function el(tag, estilos, texto) {
      const n = document.createElement(tag);
      if (estilos) n.style.cssText = estilos;
      if (texto !== undefined) n.textContent = texto;
      return n;
    }
    function boton(texto, clase, onClick, estilos) {
      const b = el('button', estilos || '', texto); b.type = 'button'; b.className = 'btn ' + clase;
      b.addEventListener('click', onClick); return b;
    }

    async function inicializar() {
      await protegerPagina();
      usuarioActual = await getCurrentUser();
      if (!usuarioActual) return;
      if (!esUUID(bitacoraId)) { window.location.href = 'perfil.html'; return; }

      const { data, error } = await window.supabaseClient.from('bitacoras')
        .select('id, publica, usuario_id, publicacion:publicaciones(id, titulo, categoria), autor:usuarios(nombre_completo, nombre_usuario)')
        .eq('id', bitacoraId).maybeSingle();

      const cab = document.getElementById('cabecera');
      if (error || !data || !data.publicacion) {
        cab.replaceChildren(el('div', 'text-align:center; padding: 40px 0;', 'Esta bitácora es privada o no existe.'),
          boton('Volver al inicio', 'btn-secondary', () => { window.location.href = 'inicio.html'; }));
        return;
      }
      bitacora = data;
      esDueno = data.usuario_id === usuarioActual.id;
      document.title = 'Bitácora · ' + data.publicacion.titulo + ' | Arnexu';
      pintarCabecera();
      if (esDueno) pintarEditor();
      await cargarEntradas();
    }

    function pintarCabecera() {
      const cab = document.getElementById('cabecera');
      const titulo = el('h1', 'font-size: 28px; margin-bottom: 6px;', '📓 ' + bitacora.publicacion.titulo);
      const sub = el('p', 'color: var(--gris-neon); margin-bottom: 16px;',
        esDueno ? 'Tu cuaderno de avances de este proyecto.' : `Bitácora de ${bitacora.autor ? bitacora.autor.nombre_completo : 'un emprendedor'} · ${bitacora.publicacion.categoria}`);
      const nodos = [titulo, sub];

      if (esDueno) {
        const panel = el('div', 'background: var(--gris-oscuro); border: 1px solid var(--gris-medio); border-radius: 12px; padding: 16px; margin-bottom: 20px;');
        const fila = el('label', 'display:flex; gap:12px; align-items:flex-start; cursor:pointer;');
        const cb = el('input'); cb.type = 'checkbox'; cb.checked = bitacora.publica; cb.style.cssText = 'width:20px; height:20px; margin-top:2px; accent-color: var(--acento);';
        const texto = el('div');
        const estado = el('div', 'font-weight:700;', bitacora.publica ? '🌐 Pública: cualquiera en Arnexu puede leerla' : '🔒 Privada: solo tú puedes verla');
        const ayuda = el('div', 'color: var(--gris-neon); font-size: 13px; margin-top: 4px;', 'Al hacerla pública se ven todas sus entradas, también las que escribas después. Puedes volver a ponerla privada cuando quieras.');
        texto.append(estado, ayuda); fila.append(cb, texto);
        cb.addEventListener('change', async () => {
          const quiere = cb.checked;
          if (quiere && !confirm('¿Hacer pública esta bitácora?\n\nTodas sus entradas serán visibles para cualquier persona en Arnexu. Revisa que no contengan datos privados.')) { cb.checked = false; return; }
          cb.disabled = true;
          const { error } = await window.supabaseClient.from('bitacoras').update({ publica: quiere }).eq('id', bitacora.id);
          cb.disabled = false;
          if (error) { cb.checked = !quiere; mostrarNotificacion('No se pudo cambiar la visibilidad', 'error'); return; }
          bitacora.publica = quiere; pintarCabecera();
          mostrarNotificacion(quiere ? 'Bitácora pública' : 'Bitácora privada');
        });
        panel.append(fila); nodos.push(panel);
      }
      const volver = el('a', 'color: var(--acento); text-decoration:none; font-size:14px; font-weight:600; display:inline-block; margin-bottom:16px;', '← Ver el proyecto');
      volver.href = 'inicio.html#pub-' + bitacora.publicacion.id;
      nodos.push(volver);
      cab.replaceChildren(...nodos);
    }

    function pintarEditor() {
      const cont = document.getElementById('editor');
      const caja = el('div', 'background: var(--gris-oscuro); border: 1px solid var(--gris-medio); border-radius: 12px; padding: 20px; margin-bottom: 24px;');
      caja.append(el('h3', 'margin-bottom: 12px;', '✍️ Nueva entrada'));
      const estilos = 'width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--gris-medio); background: var(--negro); color: var(--blanco); font-family: inherit; font-size:15px; margin-bottom:10px;';
      const titulo = el('input', estilos); titulo.type = 'text'; titulo.maxLength = 120; titulo.placeholder = 'Título (ej: Semana 3: primeras ventas)'; titulo.setAttribute('aria-label', 'Título de la entrada');
      const texto = el('textarea', estilos + 'min-height:140px; resize:vertical;'); texto.maxLength = 10000; texto.placeholder = '¿Qué avanzaste? ¿Qué aprendiste? ¿Qué sigue?'; texto.setAttribute('aria-label', 'Contenido de la entrada');
      const guardar = boton('Publicar en mi bitácora', 'btn-primary', async () => {
        const t = titulo.value.trim(), c = texto.value.trim();
        if (!t || !c) { mostrarNotificacion('Escribe un título y el contenido', 'error'); return; }
        guardar.disabled = true;
        const { error } = await window.supabaseClient.from('bitacora_entradas').insert([{ bitacora_id: bitacora.id, usuario_id: usuarioActual.id, titulo: t, contenido: c }]);
        guardar.disabled = false;
        if (error) { console.error(error); mostrarNotificacion('No se pudo guardar la entrada', 'error'); return; }
        titulo.value = ''; texto.value = '';
        mostrarNotificacion('Entrada guardada');
        await cargarEntradas();
      });
      caja.append(titulo, texto, guardar);
      cont.replaceChildren(caja);
    }

    async function cargarEntradas() {
      const cont = document.getElementById('entradas');
      const { data, error } = await window.supabaseClient.from('bitacora_entradas')
        .select('id, titulo, contenido, created_at, updated_at')
        .eq('bitacora_id', bitacora.id).order('created_at', { ascending: false }).limit(100);
      if (error) { cont.replaceChildren(el('p', 'color: var(--error);', 'No se pudieron cargar las entradas.')); return; }
      if (!data.length) {
        const v = el('div'); v.className = 'empty-state';
        v.append(el('h3', '', 'Sin entradas todavía'), el('p', '', esDueno ? 'Escribe tu primera nota: cada avance cuenta.' : 'El emprendedor aún no ha publicado avances.'));
        cont.replaceChildren(v); return;
      }
      cont.replaceChildren(...data.map(tarjeta));
    }

    function tarjeta(e) {
      const card = el('div'); card.className = 'entrada-card';
      const h = el('h3', '', e.titulo);
      const editada = e.updated_at && new Date(e.updated_at) - new Date(e.created_at) > 60000 ? ' · editada' : '';
      const f = el('div', '', formatearFecha(e.created_at) + editada); f.className = 'fecha';
      const t = el('div', '', e.contenido); t.className = 'texto';
      card.append(h, f, t);
      const fila = el('div', 'display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;');
      if (esDueno) {
        fila.append(boton('✏️ Editar', 'btn-secondary', () => editar(card, e), 'padding:8px 14px;'),
          boton('🗑️ Eliminar', 'btn-secondary', async () => {
            if (!confirm('¿Eliminar esta entrada?')) return;
            const { error } = await window.supabaseClient.from('bitacora_entradas').delete().eq('id', e.id);
            if (error) { mostrarNotificacion('No se pudo eliminar', 'error'); return; }
            mostrarNotificacion('Entrada eliminada'); await cargarEntradas();
          }, 'padding:8px 14px;'));
      } else {
        fila.append(boton('🚩 Reportar', 'btn-secondary', () => reportarContenido('bitacora', e.id), 'padding:8px 14px;'));
      }
      card.append(fila);
      return card;
    }

    function editar(card, e) {
      const estilos = 'width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--gris-medio); background: var(--negro); color: var(--blanco); font-family: inherit; font-size:15px; margin-bottom:10px;';
      const titulo = el('input', estilos); titulo.type = 'text'; titulo.maxLength = 120; titulo.value = e.titulo;
      const texto = el('textarea', estilos + 'min-height:140px; resize:vertical;'); texto.maxLength = 10000; texto.value = e.contenido;
      const fila = el('div', 'display:flex; gap:10px;');
      fila.append(boton('Cancelar', 'btn-secondary', () => cargarEntradas()),
        boton('Guardar cambios', 'btn-primary', async () => {
          const t = titulo.value.trim(), c = texto.value.trim();
          if (!t || !c) { mostrarNotificacion('Título y contenido son obligatorios', 'error'); return; }
          const { error } = await window.supabaseClient.from('bitacora_entradas').update({ titulo: t, contenido: c }).eq('id', e.id);
          if (error) { mostrarNotificacion('No se pudo guardar', 'error'); return; }
          mostrarNotificacion('Entrada actualizada'); await cargarEntradas();
        }));
      card.replaceChildren(titulo, texto, fila);
    }

    inicializar();
  </script>
</body>
</html>
