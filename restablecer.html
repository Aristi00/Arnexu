<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070910">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arnexu">
  <title>Nueva contraseña | Arnexu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=2.0.0"></script>
  <script src="js/app.js?v=2.0.0"></script>
<script src="js/push-config.js?v=2.0.0"></script>
<script src="js/pwa.js?v=2.0.0"></script>
</head>
<body data-requiere="config">
  <div class="auth-layout una-columna">
    <div class="auth-mini">
      <img class="auth-logo" src="icons/icon-192.png" alt="Logo Arnexu">
      <div class="auth-marca">ARNEXU</div>
    </div>

    <div class="auth-card">

      <!-- Estado 1: verificando el enlace -->
      <div id="estadoCargando" class="loading">Verificando tu enlace...</div>

      <!-- Estado 2: formulario -->
      <div id="estadoFormulario" style="display: none;">
        <h2 style="margin-bottom: 10px; font-size: 24px;">Crea tu nueva contraseña</h2>
        <p style="color: var(--gris-neon); font-size: 14px; margin-bottom: 25px;">Mínimo 8 caracteres, con letras y números.</p>

        <form id="restablecerForm">
          <div class="form-group">
            <label class="form-label" for="nuevaPassword">Nueva contraseña</label>
            <input type="password" id="nuevaPassword" class="form-input" placeholder="••••••••" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmarPassword">Confirmar contraseña</label>
            <input type="password" id="confirmarPassword" class="form-input" placeholder="Repite tu contraseña" autocomplete="new-password" required>
          </div>
          <button type="submit" id="btnGuardar" class="btn btn-primary btn-full">GUARDAR CONTRASEÑA</button>
        </form>
      </div>

      <!-- Estado 3: enlace inválido o vencido -->
      <div id="estadoInvalido" style="display: none; text-align: center;">
        <h2 style="margin-bottom: 10px; font-size: 22px;">Este enlace ya no sirve</h2>
        <p style="color: var(--gris-neon); font-size: 14px; margin-bottom: 25px;">
          Los enlaces vencen pronto y solo se pueden usar una vez. Pide uno nuevo para continuar.
        </p>
        <a href="recuperar.html" class="btn btn-primary btn-full" style="display: block; text-decoration: none;">PEDIR UN ENLACE NUEVO</a>
      </div>
    </div>
  </div>

  <script>
    let formularioMostrado = false;

    function mostrar(estado) {
      ['estadoCargando', 'estadoFormulario', 'estadoInvalido'].forEach(id => {
        document.getElementById(id).style.display = (id === estado) ? 'block' : 'none';
      });
    }

    // Supabase lee el enlace del correo y avisa con este evento
    window.supabaseClient.auth.onAuthStateChange((evento) => {
      if (evento === 'PASSWORD_RECOVERY') {
        formularioMostrado = true;
        mostrar('estadoFormulario');
        document.getElementById('nuevaPassword').focus();
      }
    });

    // Si el enlace viene con error (vencido, ya usado) o no llega el evento, lo avisamos
    setTimeout(() => {
      if (!formularioMostrado) mostrar('estadoInvalido');
    }, 3000);

    document.getElementById('restablecerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('nuevaPassword').value;
      const confirmar = document.getElementById('confirmarPassword').value;
      const btn = document.getElementById('btnGuardar');

      const errorPassword = validarPassword(password);
      if (errorPassword) {
        mostrarNotificacion(errorPassword, 'error');
        return;
      }
      if (password !== confirmar) {
        mostrarNotificacion('Las contraseñas no coinciden', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'GUARDANDO...';

      const { error } = await window.supabaseClient.auth.updateUser({ password });

      if (error) {
        console.error('Error cambiando contraseña:', error);
        const mensaje = (error.code === 'same_password' || /different from the old/i.test(error.message || ''))
          ? 'La nueva contraseña debe ser diferente a la anterior'
          : (error.code === 'weak_password' ? 'Esa contraseña es muy débil. Prueba con otra.' : 'No se pudo cambiar la contraseña. Pide un enlace nuevo e inténtalo otra vez.');
        mostrarNotificacion(mensaje, 'error');
        btn.disabled = false;
        btn.textContent = 'GUARDAR CONTRASEÑA';
        return;
      }

      // Cerramos la sesión de recuperación y mandamos a iniciar sesión con la clave nueva
      await window.supabaseClient.auth.signOut();
      mostrarNotificacion('Contraseña actualizada. Ya puedes iniciar sesión.');
      setTimeout(() => { window.location.href = 'index.html?msg=clave_actualizada'; }, 1500);
    });
  </script>
</body>
</html>
